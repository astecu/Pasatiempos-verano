<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><title>Pasatiempos de Verano V3</title>
<style>
:root{--b:#0ea5e9;--g:#22c55e;--r:#ef4444;--i:#102033;--m:#6b7b8c;--l:#dbe7ef}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#dff5ff,#f7fbff 30%);color:var(--i)}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 22px;background:linear-gradient(135deg,#0284c7,#0ea5e9,#22c55e);color:#fff}h1{margin:0;font-size:27px}header p{margin:6px 0 0}
main{max-width:820px;margin:auto;padding:14px 14px 100px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat,.panel,.card{background:#fff;border-radius:18px;box-shadow:0 10px 28px #173f5f18}.stat{text-align:center;padding:10px 5px}.stat b{display:block;font-size:19px}.stat small,.muted{color:var(--m)}
.panel{padding:15px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.card{border:0;padding:15px;text-align:left;min-height:125px}.card .e{font-size:28px}.card h3{margin:8px 0 4px}.card p{margin:0;color:var(--m);font-size:13px}
button,select,input{font:inherit}.primary,.secondary,.option{border:0;border-radius:13px;padding:11px 14px;font-weight:700}.primary{background:var(--b);color:#fff}.secondary{background:#eaf2f6}.option{background:#fff;border:1px solid var(--l);text-align:left}
input[type=text],select{width:100%;padding:11px;border:1px solid var(--l);border-radius:12px;background:#fff}.hidden{display:none}.puzzle{font-size:20px;line-height:1.45;margin:10px 0 15px}.options{display:grid;gap:8px}.fb{padding:12px;border-radius:12px;margin-top:12px}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
.progress{height:9px;background:#e8f1f5;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--g)}
.word{font-size:30px;letter-spacing:5px;text-align:center;margin:16px 0}.tiles{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:12px}.tile{padding:10px 12px;border-radius:11px;background:#e8f1f5;font-weight:800;font-size:18px}
.rosco{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0}.r{aspect-ratio:1;border-radius:50%;border:0;background:#e8f1f5;font-weight:800}.r.on{background:var(--b);color:#fff}.r.good{background:var(--g);color:#fff}.r.bad{background:var(--r);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(12px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--l)}nav div{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}nav button{border:0;border-radius:12px;background:#edf4f7;padding:9px}
@media(max-width:410px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1>☀️ Pasatiempos de Verano V3</h1><p>Más juegos, dificultad y estadísticas</p></header>
<main><section id="home">
<div class="stats"><div class="stat"><b id="score">0</b><small>Puntos</small></div><div class="stat"><b id="wins">0</b><small>Aciertos</small></div><div class="stat"><b id="streak">0</b><small>Racha</small></div><div class="stat"><b id="level">1</b><small>Nivel</small></div></div>
<div class="panel"><b>Dificultad</b><select id="diff" onchange="setDiff(this.value)"><option value="facil">Fácil</option><option value="media">Media</option><option value="dificil">Difícil</option></select></div>
<div class="panel"><b>🌞 Juego del día</b><p class="muted">Cambia según la fecha.</p><button class="primary" onclick="daily()">Jugar</button></div>
<h2>Juegos</h2><div class="grid">
<button class="card" onclick="quiz()"><div class="e">🧠</div><h3>Acertijos</h3><p>Lógica y preguntas trampa.</p></button>
<button class="card" onclick="anagram()"><div class="e">🔀</div><h3>Anagramas</h3><p>Ordena las letras.</p></button>
<button class="card" onclick="emoji()"><div class="e">🎬</div><h3>Emojis</h3><p>Adivina películas y música.</p></button>
<button class="card" onclick="hangman()"><div class="e">🪢</div><h3>Ahorcado</h3><p>Palabras por dificultad.</p></button>
<button class="card" onclick="tf()"><div class="e">⚡</div><h3>Verdadero/Falso</h3><p>Cultura general.</p></button>
<button class="card" onclick="defs()"><div class="e">🟨</div><h3>Autodefinidos</h3><p>Definiciones rápidas.</p></button>
<button class="card" onclick="categories()"><div class="e">🗂️</div><h3>Categorías</h3><p>Encuentra la palabra intrusa.</p></button>
<button class="card" onclick="rosco()"><div class="e">⭕</div><h3>Rosco</h3><p>Definiciones por letra.</p></button>
</div>
<div class="panel"><b>🏆 Progreso</b><p class="muted">Cada 15 puntos subes de nivel.</p><div class="progress"><div id="bar"></div></div></div>
<div class="panel"><b>📊 Estadísticas</b><div id="statsBox" class="muted" style="margin-top:8px"></div></div>
</section><section id="game" class="hidden"></section></main>
<nav><div><button onclick="homeGo()">🏠<br>Inicio</button><button onclick="daily()">🌞<br>Del día</button><button onclick="resetAll()">↻<br>Reiniciar</button></div></nav>
<script>
const D={score:0,wins:0,streak:0,diff:"facil",stats:{},queues:{}};const S=Object.assign(D,JSON.parse(localStorage.getItem("pv3")||"{}"));
function save(){localStorage.setItem("pv3",JSON.stringify(S));render()}function render(){score.textContent=S.score;wins.textContent=S.wins;streak.textContent=S.streak;level.textContent=Math.floor(S.score/15)+1;bar.style.width=((S.score%15)/15*100)+"%";diff.value=S.diff;statsBox.innerHTML=Object.keys(S.stats).length?Object.entries(S.stats).map(([k,v])=>`${k}: <b>${v.ok}/${v.played}</b>`).join("<br>"):"Todavía no hay partidas."}render()
function setDiff(v){S.diff=v;save()}function norm(s){return(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toUpperCase()}
function award(n,ok){S.stats[n]=S.stats[n]||{played:0,ok:0};S.stats[n].played++;if(ok){S.stats[n].ok++;S.score++;S.wins++;S.streak++}else S.streak=0;save()}
function next(key,len){S.queues[key]=S.queues[key]||[];if(!S.queues[key].length)S.queues[key]=[...Array(len).keys()].sort(()=>Math.random()-.5);let n=S.queues[key].shift();save();return n}
function shell(t,b){home.classList.add("hidden");game.classList.remove("hidden");game.innerHTML=`<button class="secondary" onclick="homeGo()">← Inicio</button><div class="panel"><h2>${t}</h2>${b}</div>`}
function homeGo(){game.classList.add("hidden");home.classList.remove("hidden");render()}

const Q={facil:[
["¿Cuántos meses tienen 28 días?",["Uno","Todos","Seis"],1,"Todos tienen al menos 28 días."],
["¿Qué pesa más: 1 kg de hierro o 1 kg de plumas?",["Hierro","Plumas","Lo mismo"],2,"Pesan lo mismo."],
["Un gallo pone un huevo en un tejado. ¿Hacia qué lado cae?",["Izquierda","Derecha","Ninguno"],2,"Los gallos no ponen huevos."]
],media:[
["Adelantas al segundo en una carrera. ¿En qué posición quedas?",["Primero","Segundo","Tercero"],1,"Ocupas el segundo puesto."],
["Una mujer tiene 4 hijas y cada hija un hermano. ¿Cuántos hijos tiene?",["5","8","4"],0,"Comparten el mismo hermano."],
["3 pastillas, una cada 30 min. ¿Cuánto tardas en tomarlas?",["1 hora","1,5 horas","30 min"],0,"La tercera se toma a los 60 minutos."]
],dificil:[
["Un reloj tarda 5 s en dar 6 campanadas. ¿Cuánto en dar 12?",["10 s","11 s","12 s"],1,"12 campanadas crean 11 intervalos."],
["Dos padres y dos hijos pescan 3 peces y cada uno lleva uno. ¿Cómo?",["Son 3 personas","Uno no pescó","Imposible"],0,"Abuelo, padre e hijo."],
["¿Qué número sigue? 1, 1, 2, 3, 5, 8...",["11","12","13"],2,"Es la sucesión de Fibonacci."]
]};let curQ;
function quiz(){let a=Q[S.diff];curQ=a[next("q-"+S.diff,a.length)];shell("🧠 Acertijo",`<div class="puzzle">${curQ[0]}</div><div class="options">${curQ[1].map((x,i)=>`<button class="option" onclick="qAns(${i})">${x}</button>`).join("")}</div><div id="out"></div>`)}
function qAns(i){let ok=i===curQ[2];award("Acertijos",ok);out.innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✅ Correcto":"❌ No"}<br>${curQ[3]}</div><p><button class="primary" onclick="quiz()">Otra</button></p>`}

const ANA=[["NRAEVEO","VERANO"],["YAPLA","PLAYA"],["ODHLEA","HELADO"],["SOTFIEA","FIESTA"],["NIPCAIS","PISCINA"],["RAOCB","BARCO"],["TAMALE","MALETA"],["JAEVI","VIAJE"],["RBAOES","SABOR"],["TCEAR","CARTA"]];let ca;
function anagram(){ca=ANA[next("ana",ANA.length)];shell("🔀 Anagrama",`<div class="tiles">${ca[0].split("").map(x=>`<span class="tile">${x}</span>`).join("")}</div><input id="ans" type="text" placeholder="Palabra"><p><button class="primary" onclick="aCheck()">Comprobar</button></p><div id="out"></div>`)}
function aCheck(){let ok=norm(ans.value)===ca[1];award("Anagramas",ok);out.innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✅ Correcto":"❌ Era "+ca[1]}</div>`}

const EM=[["👴🎈🏠☁️","UP"],["🦁👑","EL REY LEON"],["🚢🧊💔","TITANIC"],["👻🔫","CAZAFANTASMAS"],["👑👑👑👑🇸🇪","ABBA"],["👽📞🏠","ET"],["🧙‍♂️💍🌋","EL SENOR DE LOS ANILLOS"],["🦖🏝️🚙","JURASSIC PARK"],["👠🎃🏰","CENICIENTA"],["🐠🔎🌊","BUSCANDO A NEMO"]];let ce;
function emoji(){ce=EM[next("emo",EM.length)];shell("🎬 Emojis",`<div style="font-size:42px;text-align:center;margin:15px">${ce[0]}</div><input id="ans" type="text" placeholder="¿Qué representa?"><p><button class="primary" onclick="eCheck()">Comprobar</button></p><div id="out"></div>`)}
function eCheck(){let ok=norm(ans.value)===norm(ce[1]);award("Emojis",ok);out.innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✅ Correcto":"❌ Era "+ce[1]}</div>`}

const HW={facil:["VERANO","PLAYA","BARCO","VIAJE","FIESTA"],media:["PISCINA","AMIGOS","HELADO","MALETA","TERRAZA"],dificil:["SOMBRILLA","ACANTILADO","BRONCEADOR","EXCURSION","CHIRINGUITO"]};let hw,hf,hg;
function hangman(){let a=HW[S.diff];hw=a[next("h-"+S.diff,a.length)];hf=0;hg=[];hRender()}
function hRender(){shell("🪢 Ahorcado",`<p>Fallos: <b id="fails">${hf}</b>/6</p><div id="word" class="word">${hw.split("").map(c=>hg.includes(c)?c:"_").join(" ")}</div><input id="letter" type="text" maxlength="1" placeholder="Una letra"><p><button class="primary" onclick="hGuess()">Probar</button></p><div id="out"></div>`)}
function hGuess(){let l=norm(letter.value);if(!l)return;if(!hg.includes(l))hg.push(l);if(!hw.includes(l))hf++;let txt=hw.split("").map(c=>hg.includes(c)?c:"_").join(" ");word.textContent=txt;fails.textContent=hf;if(!txt.includes("_")){award("Ahorcado",true);out.innerHTML=`<div class="fb ok">✅ Resuelto</div><p><button class="primary" onclick="hangman()">Otra</button></p>`}else if(hf>=6){award("Ahorcado",false);out.innerHTML=`<div class="fb bad">❌ Era ${hw}</div><p><button class="primary" onclick="hangman()">Otra</button></p>`}letter.value=""}

const TF=[["La capital de Australia es Sídney.",false,"Es Canberra."],["Un pulpo tiene tres corazones.",true,"Correcto."],["Los delfines son peces.",false,"Son mamíferos."],["Venus es el planeta más caliente.",true,"Por su fuerte efecto invernadero."],["El sonido viaja más rápido que la luz.",false,"La luz es muchísimo más rápida."],["Un adulto suele tener 206 huesos.",true,"Correcto."],["El Nilo desemboca en el Atlántico.",false,"Desemboca en el Mediterráneo."],["La Antártida es un desierto.",true,"Es un desierto polar."]];let ct;
function tf(){ct=TF[next("tf",TF.length)];shell("⚡ Verdadero/Falso",`<div class="puzzle">${ct[0]}</div><button class="primary" onclick="tCheck(true)">Verdadero</button> <button class="secondary" onclick="tCheck(false)">Falso</button><div id="out"></div>`)}
function tCheck(v){let ok=v===ct[1];award("Verdadero/Falso",ok);out.innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✅ Correcto":"❌ No"}<br>${ct[2]}</div>`}

const DF=[["Astro del día","SOL"],["Gran masa de agua salada","MAR"],["Postre frío","HELADO"],["Zona de arena junto al mar","PLAYA"],["Protege del sol en la playa","SOMBRILLA"],["Vehículo que navega","BARCO"],["Periodo de descanso laboral o escolar","VACACIONES"],["Lugar con agua para nadar","PISCINA"]];let cd;
function defs(){cd=DF[next("def",DF.length)];shell("🟨 Autodefinido",`<div class="puzzle">${cd[0]}</div><input id="ans" type="text" placeholder="Respuesta"><p><button class="primary" onclick="dCheck()">Comprobar</button></p><div id="out"></div>`)}
function dCheck(){let ok=norm(ans.value)===norm(cd[1]);award("Autodefinidos",ok);out.innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✅ Correcto":"❌ Era "+cd[1]}</div>`}

const CAT=[[["Manzana","Pera","Plátano","Zanahoria"],3,"Zanahoria no es fruta."],[["Madrid","Roma","París","Andalucía"],3,"Andalucía no es una capital."],[["Tenis","Baloncesto","Natación","Violín"],3,"Violín no es un deporte."],[["Rojo","Azul","Verde","Mesa"],3,"Mesa no es un color."],[["Perro","Gato","Caballo","Salmón"],3,"Salmón es un pez."]];let cc;
function categories(){cc=CAT[next("cat",CAT.length)];shell("🗂️ Palabra intrusa",`<div class="puzzle">¿Cuál no pertenece al grupo?</div><div class="options">${cc[0].map((x,i)=>`<button class="option" onclick="cCheck(${i})">${x}</button>`).join("")}</div><div id="out"></div>`)}
function cCheck(i){let ok=i===cc[1];award("Categorías",ok);out.innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✅ Correcto":"❌ No"}<br>${cc[2]}</div>`}

const RO={A:["Ave rapaz","AGUILA"],B:["Objeto redondo deportivo","BALON"],C:["Lugar donde vives","CASA"],D:["Jornada de 24 horas","DIA"],E:["Animal con trompa","ELEFANTE"],F:["Celebración con música","FIESTA"],G:["Animal que maúlla","GATO"],H:["Postre frío","HELADO"],I:["Tierra rodeada de agua","ISLA"],J:["Diversión con reglas","JUEGO"],L:["Satélite de la Tierra","LUNA"],M:["Masa de agua salada","MAR"],N:["Masa del cielo","NUBE"],O:["Movimiento del mar","OLA"],P:["Zona de arena junto al mar","PLAYA"],R:["Corriente natural de agua","RIO"],S:["Astro del día","SOL"],T:["Bebida infusionada","TE"],V:["Estación del calor","VERANO"],Z:["Calzado de verano","ZAPATILLA"]};let keys=Object.keys(RO),ri=0,rs={};
function rosco(){let l=keys[ri%keys.length];shell("⭕ Rosco",`<div class="rosco">${keys.map(x=>`<button class="r ${x===l?"on":""} ${rs[x]||""}">${x}</button>`).join("")}</div><div class="puzzle"><b>${l}</b>: ${RO[l][0]}</div><input id="ans" type="text"><p><button class="primary" onclick="rCheck('${l}')">Responder</button> <button class="secondary" onclick="ri++;rosco()">Pasapalabra</button></p><div id="out"></div>`)}
function rCheck(l){let ok=norm(ans.value)===norm(RO[l][1]);rs[l]=ok?"good":"bad";award("Rosco",ok);out.innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✅ Correcto":"❌ Era "+RO[l][1]}</div><p><button class="primary" onclick="ri++;rosco()">Siguiente</button></p>`}

function daily(){[quiz,anagram,emoji,tf,defs,categories][Math.floor(Date.now()/86400000)%6]()}
function resetAll(){if(confirm("¿Borrar todo el progreso?")){localStorage.removeItem("pv3");location.reload()}}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
